<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="app-version" content="20261127232327">
<script>
// Auto-update: if a newer version is on GitHub, reload it (address bar stays clean, e.g. just admin.html).
(function () {
  const mine = document.querySelector('meta[name=app-version]').content;
  const u0 = new URL(location.href);
  if (u0.searchParams.has('v')) { u0.searchParams.delete('v'); history.replaceState(null, '', u0.pathname + u0.search + u0.hash); }
  async function check() {
    try {
      const { v } = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json();
      if (!v || v === mine) return;
      if (sessionStorage.getItem('upd-tried') === v) return; // tried once already: never loop
      if (window.canReload && !window.canReload()) return setTimeout(check, 15000); // busy — try again shortly
      sessionStorage.setItem('upd-tried', v);
      const u = new URL(location.href); u.searchParams.set('v', v); location.replace(u.toString());
    } catch {}
  }
  check(); setInterval(check, 3 * 60 * 1000);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && check());
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1917">
<title>Intake · Burger Bytes</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="staff.css?v=20261127232327">
<script src="config.js?v=20261127232327"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<script>window.ROLE = 'intake';</script>
<script src="staff.js?v=20261127232327"></script>
<script>
const cart = { cheese: 0, plain: 0, coke: 0, extra: 0, parcel: false, pay: null, given: 0 }; // pay: 'CASH' | 'UPI'
let search = '', built = false, placing = false;
window.canReload = () => !placing && cart.cheese + cart.plain + cart.coke + cart.extra === 0 && !cart.parcel && !cart.pay && !document.querySelector('.tokenpop');

function parcelAmount() {
  if (!cart.parcel) return 0;
  return S.parcelMode === 'burger' ? (cart.cheese + cart.plain) * Number(S.parcelCharge) : Number(S.parcelCharge);
}
const extraPrice = () => Number(S.extraPrice ?? 5);
const cartTotal = () => cart.cheese * S.cheesePrice + cart.plain * S.plainPrice + cart.coke * S.cokePrice + cart.extra * extraPrice() + parcelAmount();

window.render = () => {
  if (!built) buildLayout();
  paintBuilder(); paintList();
};
function buildLayout() {
  built = true;
  $('main').innerHTML = `<div class="intake">
    <div class="builder">
      <div id="items"></div>
      <button class="tog" id="parcelBtn"></button>
      <div class="pay">
        <button data-p="CASH">💵 CASH</button><button data-p="UPI">📱 UPI</button>
      </div>
      <div class="cashbox hidden" id="cashbox">
        <label for="given">Customer gave</label>
        <div class="givenrow"><span>₹</span><input id="given" type="number" inputmode="numeric" min="0" placeholder="0"></div>
        <div class="quick" id="quick"></div>
        <div class="change" id="change"></div>
      </div>
      <div class="tot"><span id="cnt"></span><b id="total">₹0</b></div>
      <button class="place" id="place">PLACE ORDER</button>
      <div class="hint" id="hint"></div>
    </div>
    <div>
      <div class="listhead"><h2>Open tokens</h2><span id="mini" style="color:var(--mute);font-weight:700"></span>
        <input id="q" type="search" inputmode="numeric" placeholder="Token #"></div>
      <div class="olist" id="list"></div>
    </div>
  </div>`;
  document.querySelectorAll('.pay button').forEach((b) => b.onclick = () => {
    cart.pay = b.dataset.p; paintBuilder();
    if (cart.pay === 'CASH') setTimeout(() => $('given').focus(), 30);
  });
  $('given').oninput = (e) => { cart.given = Math.max(0, Number(e.target.value) || 0); paintBuilder(); };
  $('given').onkeydown = (e) => { if (e.key === 'Enter' && !$('place').disabled) place(); };
  $('parcelBtn').onclick = () => { cart.parcel = !cart.parcel; paintBuilder(); };
  $('place').onclick = place;
  $('q').oninput = (e) => { search = e.target.value.replace(/\D/g, ''); paintList(); };
}
function itemRow(k, name, price, cls = '') {
  return `<div class="it ${cls}"><div class="nm">${esc(name)}<small>${rupee(price)}</small></div>
    <button onclick="chg('${k}',-1)">−</button><span class="q">${cart[k]}</span><button class="plus" onclick="chg('${k}',1)">+</button></div>`;
}
function chg(k, d) {
  cart[k] = Math.max(0, Math.min(50, cart[k] + d));
  if (k === 'extra' && d > 0 && cart.extra > cart.cheese + cart.plain) { cart.extra = cart.cheese + cart.plain; flashHint('Add a burger first — extra cheese goes on a burger'); }
  cart.extra = Math.min(cart.extra, cart.cheese + cart.plain); // fewer burgers → fewer extra cheese
  paintBuilder();
}
let hintTimer = null;
function flashHint(t) { clearTimeout(hintTimer); $('hint').textContent = t; $('hint').style.color = '#b91c1c'; hintTimer = setTimeout(() => { hintTimer = null; $('hint').style.color = ''; paintBuilder(); }, 2500); }
function paintBuilder() {
  $('items').innerHTML = itemRow('cheese', S.cheeseName, S.cheesePrice) + itemRow('plain', S.plainName, S.plainPrice)
    + itemRow('extra', '➕ Extra cheese', extraPrice(), 'extra') + itemRow('coke', S.cokeName, S.cokePrice);
  const pa = parcelAmount();
  $('parcelBtn').className = 'tog' + (cart.parcel ? ' on' : '');
  $('parcelBtn').textContent = cart.parcel
    ? `🛍️ PARCEL ✓  +${rupee(pa)}${S.parcelMode === 'burger' ? ` (${rupee(S.parcelCharge)} × burger)` : ''}`
    : `🛍️ Parcel?  (+${rupee(S.parcelCharge)}${S.parcelMode === 'burger' ? ' per burger' : ''})`;
  document.querySelectorAll('.pay button').forEach((b) => b.classList.toggle('on', b.dataset.p === cart.pay));
  // cash: what the customer handed over, and the change to give back
  const total = cartTotal();
  $('cashbox').classList.toggle('hidden', cart.pay !== 'CASH');
  if (cart.pay === 'CASH') {
    const notes = [...new Set([total, ...[50, 100, 200, 500, 2000].filter((x) => x > total)])].filter((x) => x > 0).slice(0, 5);
    const qk = notes.join(',');
    if ($('quick').dataset.k !== qk) { // rebuild only when the total changes (keeps taps smooth)
      $('quick').dataset.k = qk;
      $('quick').innerHTML = notes.map((x, i) => `<button data-v="${x}">${i === 0 && x === total ? 'Exact ' : ''}${rupee(x)}</button>`).join('');
      $('quick').querySelectorAll('button').forEach((b) => b.onclick = () => { cart.given = Number(b.dataset.v); $('given').value = cart.given; paintBuilder(); });
    }
    const diff = cart.given - total, ch = $('change');
    ch.className = 'change ' + (!cart.given ? '' : diff >= 0 ? 'ok' : 'short');
    ch.innerHTML = !cart.given ? 'Type the amount the customer gave'
      : diff >= 0 ? `GIVE BACK <b>${rupee(diff)}</b>` : `SHORT BY <b>${rupee(-diff)}</b> — ask for more`;
  }
  const n = cart.cheese + cart.plain + cart.coke;
  $('cnt').textContent = n ? `${n} item${n > 1 ? 's' : ''}` : 'No items';
  $('total').textContent = rupee(cartTotal());
  const why = !S.isOpen ? 'Stall is closed' : !n ? 'Add items' : !cart.pay ? 'Choose Cash or UPI'
    : cart.pay === 'CASH' && cart.given < total ? (cart.given ? 'Customer gave less than the total' : 'Type the cash the customer gave') : '';
  $('place').disabled = !!why || placing;
  $('place').textContent = why ? 'PLACE ORDER' : `PLACE ORDER · ${rupee(cartTotal())}`;
  if (!hintTimer) $('hint').textContent = why;
}
async function place() {
  if (placing) return;
  placing = true; paintBuilder();
  const args = { p_pin: pin, p_cheese: cart.cheese, p_plain: cart.plain, p_coke: cart.coke, p_parcel: cart.parcel, p_method: cart.pay };
  if (cart.extra > 0) args.p_extra = cart.extra; // only orders with extra cheese need the update-5 database function
  const { data, error } = await sb.rpc('intake_place', args);
  const given = cart.given, change = cart.pay === 'CASH' ? cart.given - cartTotal() : 0;
  placing = false;
  if (error) { paintBuilder(); return alert(/schema cache|intake_place/.test(error.message) ? 'Extra cheese needs a quick database update — ask the admin to run update-5-extra-cheese.sql. The order was NOT placed.' : 'No connection — the order was NOT placed. Try again.'); }
  if (!data.ok) { paintBuilder(); return alert(data.error); }
  const o = data.order;
  Object.assign(cart, { cheese: 0, plain: 0, coke: 0, extra: 0, parcel: false, pay: null, given: 0 }); $('given').value = '';
  paintBuilder(); poll();
  const pop = document.createElement('div');
  pop.className = 'tokenpop';
  pop.innerHTML = `<div>
    <div class="lbl">TELL THE CUSTOMER — TOKEN</div>
    <div class="n">#${o.token}</div>
    <div class="sum">${short(o)}${o.parcel ? ' · 🛍️ Parcel' : ''}</div>
    <div class="amt">${rupee(o.total)} · ${o.payment === 'PAID' ? '✅ ' + o.payMethod : '⏳ NOT PAID'}</div>
    ${o.payMethod === 'CASH' ? `<div class="sum">Got ${rupee(given)} → <b style="font-size:36px;color:#4ade80">GIVE BACK ${rupee(change)}</b></div>` : ''}
    <button>NEXT ORDER</button></div>`;
  pop.querySelector('button').onclick = () => pop.remove();
  document.body.appendChild(pop);
}
function paintList() {
  const C = { NEW: 'var(--new)', PREPARING: 'var(--prep)', READY: 'var(--ready)', DELIVERED: 'var(--done)', CANCELLED: 'var(--cancel)' };
  const live = orders.filter((o) => o.status !== 'CANCELLED');
  const unpaid = live.filter((o) => o.payment === 'NOT_PAID');
  $('mini').textContent = `${live.length} orders · ${live.filter((o) => o.status === 'DELIVERED').length} delivered · ${unpaid.length ? unpaid.length + ' unpaid (' + rupee(unpaid.reduce((s, o) => s + Number(o.total), 0)) + ')' : 'all paid'}`;
  // finished tokens leave the list (delivered or cancelled) — except delivered ones still waiting for money.
  // Searching a token number still finds any token.
  const active = (o) => (o.status !== 'DELIVERED' && o.status !== 'CANCELLED') || (o.status === 'DELIVERED' && o.payment === 'NOT_PAID');
  const list = [...orders].reverse().filter((o) => (search ? String(o.token).startsWith(search) : active(o)));
  $('list').innerHTML = list.length ? list.map((o) => `
    <div class="orow ${o.status}" style="--c:${C[o.status]}">
      <div class="no">#${o.token}</div>
      <div class="what">${short(o)}${o.parcel ? ' · <span class="parcel" style="padding:1px 8px">🛍️ Parcel</span>' : ''}<br>
        <span>${new Date(o.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
        <span class="pill s-${o.status}">${o.status === 'PREPARING' ? 'COOKING' : o.status}</span></div>
      <div class="side">
        <div class="amt">${rupee(o.total)}</div>
        <span class="pill p-${o.payment}">${o.payment === 'PAID' ? 'PAID · ' + o.payMethod : 'NOT PAID'}</span>
        <div class="btns">
          ${o.status !== 'CANCELLED' && o.payment === 'NOT_PAID' ? `<button class="cash" onclick="act('${o.id}','paid_cash')">💵 Cash</button><button class="upi" onclick="act('${o.id}','paid_upi')">📱 UPI</button>` : ''}
          ${o.status !== 'CANCELLED' && o.payment === 'PAID' ? `<button onclick="unpay('${o.id}',${o.token})">undo paid</button>` : ''}
          ${o.status === 'NEW' || o.status === 'PREPARING' ? `<button class="x" onclick="cancelOrder('${o.id}',${o.token})">Cancel</button>` : ''}
        </div>
      </div>
    </div>`).join('') : `<div class="empty">${search ? 'No token #' + search : orders.length ? 'All tokens delivered ✅' : 'No orders yet today'}</div>`;
}
function unpay(id, n) { if (confirm(`Mark token #${n} as NOT paid?`)) act(id, 'unpaid'); }
function cancelOrder(id, n) { if (confirm(`Cancel token #${n}? The kitchen will be told to stop.`)) act(id, 'cancel'); }
</script>

</html>
