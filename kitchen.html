<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="app-version" content="20261127231804">
<script>
// Auto-update: if a newer version is on GitHub, reload it (address bar stays clean, e.g. just admin.html).
(function () {
  const mine = document.querySelector('meta[name=app-version]').content;
  const u0 = new URL(location.href);
  if (u0.searchParams.has('v')) { u0.searchParams.delete('v'); history.replaceState(null, '', u0.pathname + u0.search + u0.hash); }
  async function check() {
    try {
      const { v } = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json();
      if (!v || v === mine) return;
      if (sessionStorage.getItem('upd-tried') === v) return; // tried once already: never loop
      if (window.canReload && !window.canReload()) return setTimeout(check, 15000); // busy — try again shortly
      sessionStorage.setItem('upd-tried', v);
      const u = new URL(location.href); u.searchParams.set('v', v); location.replace(u.toString());
    } catch {}
  }
  check(); setInterval(check, 3 * 60 * 1000);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && check());
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1917">
<title>Kitchen · Burger Bytes</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="staff.css?v=20261127231804">
<script src="config.js?v=20261127231804"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<script>window.ROLE = 'kitchen';</script>
<script src="staff.js?v=20261127231804"></script>
<script>
const fresh = new Set();
window.onChanges = (next, prev) => {
  let added = false;
  for (const o of next) {
    const was = prev.get(o.id);
    if (!was && (o.status === 'NEW' || o.status === 'PREPARING')) { added = true; fresh.add(o.id); }
    if (o.status === 'CANCELLED' && was && was !== 'CANCELLED' && was !== 'DELIVERED') {
      beepCancel(); flash('cancel', '❌ CANCELLED — DO NOT MAKE', o.token, 'The counter cancelled this order.', 9000);
    }
  }
  if (added) beepNew();
};
window.render = () => {
  const queue = orders.filter((o) => o.status === 'NEW' || o.status === 'PREPARING'); // oldest first
  const ready = orders.filter((o) => o.status === 'READY');
  const todo = queue.reduce((a, o) => ({ c: a.c + o.cheese, p: a.p + o.plain, x: a.x + (o.extra || 0) }), { c: 0, p: 0, x: 0 });
  $('main').innerHTML = `
    <div class="summary">
      <div>Tokens waiting<b>${queue.length}</b></div>
      <div style="background:#fdb436;color:#422006">🧀 WITH CHEESE to make<b>${todo.c}</b></div>
      <div style="border:3px dashed #1c1917">WITHOUT CHEESE to make<b>${todo.p}</b></div>
      ${todo.x ? `<div style="background:#dc2626;color:#fff">➕ EXTRA CHEESE<b style="color:#fff">${todo.x}</b></div>` : ''}
    </div>
    ${queue.length ? `<div class="cards">${queue.map(card).join('')}</div>` : '<div class="empty">✅ All done — no tokens waiting</div>'}
    ${ready.length ? `<div class="strip">Ready, waiting for delivery: ${ready.map((o) =>
      `<span class="chip">#${o.token}<button onclick="undo('${o.id}',${o.token})">undo</button></span>`).join('')}</div>` : ''}`;
  fresh.clear();
};
function card(o) {
  const m = mins(o.createdAt);
  return `<div class="tk ${fresh.has(o.id) ? 'fresh' : ''}" style="--c:var(--new)">
    <div class="tk-top">
      <div class="tk-no"><small>TOKEN</small>#${o.token}</div>
      <div class="tk-age ${ageClass(m)}">${m} min</div>
    </div>
    ${o.parcel ? '<div><span class="parcel">🛍️ PARCEL</span></div>' : ''}
    ${lines(o)}
    <button class="big b-ready" onclick="act('${o.id}','ready')">✅ READY</button>
  </div>`;
}
function undo(id, n) { if (confirm(`Move token #${n} back to cooking?`)) act(id, 'unready'); }
</script>
</body>
</html>
