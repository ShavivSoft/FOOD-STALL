<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="app-version" content="20261127232327">
<script>
// Auto-update: if a newer version is on GitHub, reload it (address bar stays clean, e.g. just admin.html).
(function () {
  const mine = document.querySelector('meta[name=app-version]').content;
  const u0 = new URL(location.href);
  if (u0.searchParams.has('v')) { u0.searchParams.delete('v'); history.replaceState(null, '', u0.pathname + u0.search + u0.hash); }
  async function check() {
    try {
      const { v } = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json();
      if (!v || v === mine) return;
      if (sessionStorage.getItem('upd-tried') === v) return; // tried once already: never loop
      if (window.canReload && !window.canReload()) return setTimeout(check, 15000); // busy — try again shortly
      sessionStorage.setItem('upd-tried', v);
      const u = new URL(location.href); u.searchParams.set('v', v); location.replace(u.toString());
    } catch {}
  }
  check(); setInterval(check, 3 * 60 * 1000);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && check());
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fdb436">
<title>Burger Bytes</title>
<link rel="icon" href="favicon.ico" sizes="any">

  .i{background:#9b3700}.k{background:#2563eb}.d{background:#0f766e}.a{background:#1c1917}
</style>
</head>
